# Netlify Configuration for Portfolio

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

# Cache headers for performance
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
